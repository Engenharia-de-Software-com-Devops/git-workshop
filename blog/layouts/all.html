<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <style>
    :root, [data-theme="light"] {
      color-scheme: light;
      --bg: #f4f1ea; --fg: #2b2b2b; --muted: #5f5b55; --accent: #1f1f1f; --border: #d8d2c6;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #000; --fg: #fff; --muted: #aaa; --accent: #fff; --border: #333;
    }
    a { text-decoration: underline; text-underline-offset: 3px; }
    header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; padding-bottom: 1rem; }
    header h1 { margin: 0; }
    .tools { display: flex; gap: .5rem; }
    .tools input, .tools button { font: inherit; font-size: .9rem; padding: .35rem .6rem; background: var(--bg); color: var(--fg); border: 1px solid var(--fg); border-radius: 4px; }
    .tools button { cursor: pointer; }
    .hidden { display: none; }
    #theme { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
    [data-theme="light"] .i-sun, [data-theme="dark"] .i-moon { display: none; }
    body {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--fg);
      font: 1.0625rem/1.7 system-ui, sans-serif;
    }
    header {
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    header h1 a { color: var(--fg); }
    a { color: var(--accent); }
    a:hover { text-decoration: underline; }
    h2 { color: var(--muted); font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; }
    article { border-bottom: 1px solid var(--border); }
    article h3 { margin: .75rem 0; }
    img { max-width: 100%; }
    table { border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: .35rem .6rem; text-align: left; }
    code { font-size: .9em; }
    blockquote { margin: 0; padding-left: 1rem; border-left: 3px solid var(--accent); color: var(--muted); }
    pre { overflow-x: auto; padding: 1rem; border: 1px solid var(--border); border-radius: 6px; }
  </style>
  <script>
    // ponytail: no-flash theme: saved choice, else OS preference
    document.documentElement.dataset.theme = localStorage.theme ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body>
  <header>
    <h1>
      <a href="{{ .Site.Home.RelPermalink }}">
        {{ .Site.Title }}
      </a>
    </h1>
    <form class="tools" action="{{ .Site.Home.RelPermalink }}" role="search">
      <input id="q" name="q" type="search" placeholder="Pesquisar..." aria-label="Pesquisar">
      <button type="button" id="theme" aria-label="Alternar tema claro/escuro"><svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </form>
  </header>

  <main>
    {{ if .IsHome }}
      <h2>Minhas postagens</h2>

      {{ range .Site.RegularPages }}
        <article data-text="{{ lower (printf "%s %s" .Title .Plain) }}">
          <h3>
            <a href="{{ .RelPermalink }}">
              {{ .Title }}
            </a>
          </h3>
        </article>
      {{ end }}
      <p id="none" class="hidden">Nenhum resultado.</p>

    {{ else }}
      {{ .Content }}
    {{ end }}
  </main>
  <script>
    document.getElementById('theme').onclick = () => {
      const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = localStorage.theme = t;
    };
    const q = document.getElementById('q');
    const posts = document.querySelectorAll('article[data-text]');
    if (posts.length) {
      const filter = () => {
        const terms = q.value.toLowerCase().trim().split(/\s+/);
        let shown = 0;
        posts.forEach(a => {
          const hit = terms.every(t => a.dataset.text.includes(t));
          a.classList.toggle('hidden', !hit);
          shown += hit;
        });
        document.getElementById('none').classList.toggle('hidden', shown > 0);
      };
      q.value = new URLSearchParams(location.search).get('q') || '';
      q.oninput = filter;
      q.form.onsubmit = e => e.preventDefault();
      filter();
    }
  </script>
</body>
</html>
